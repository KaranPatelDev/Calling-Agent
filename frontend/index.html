<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Automated outbound calling agent platform with AI-powered scripts, contact management, and campaign automation." />
    <title>Calling Agent - Smart Outbound Calling Platform</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <style>
      body { margin: 0; font-family: 'Inter', system-ui, -apple-system, sans-serif; }
      #app-loader {
        position: fixed; inset: 0; display: flex; flex-direction: column;
        align-items: center; justify-content: center; background: #f9fafb; z-index: 9999;
      }
      #app-loader .spinner {
        width: 40px; height: 40px; border: 3px solid #e5e7eb;
        border-top-color: #2563eb; border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      #app-loader .text { margin-top: 16px; color: #6b7280; font-size: 14px; }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="app-loader">
        <div class="spinner"></div>
        <div class="text">Loading...</div>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>

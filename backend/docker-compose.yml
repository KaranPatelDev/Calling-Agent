version: "3.9"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: calling_agent
      POSTGRES_PASSWORD: calling_agent_secret
      POSTGRES_DB: calling_agent
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U calling_agent"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://calling_agent:calling_agent_secret@db:5432/calling_agent
      DATABASE_URL_SYNC: postgresql://calling_agent:calling_agent_secret@db:5432/calling_agent
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: super-secret-change-me-in-production-9f8e7d6c5b4a
      EXOTEL_ACCOUNT_SID: EXOTEL_ACCOUNT_SID_PLACEHOLDER
      EXOTEL_API_KEY: EXOTEL_API_KEY_PLACEHOLDER
      EXOTEL_API_TOKEN: EXOTEL_API_TOKEN_PLACEHOLDER
      EXOTEL_CALLER_ID: "+919999999999"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - uploads:/app/uploads

volumes:
  pgdata:
  uploads:
